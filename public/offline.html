<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5891f" />
    <title>Sin conexión · ANCONnet</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f5f7; color: #1a1d23; padding: 24px; box-sizing: border-box; }
      main { max-width: 340px; text-align: center; }
      .logo { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 20px;
        background: linear-gradient(135deg, #f5891f, #e1251b); }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #5a6270; margin: 0 0 20px; }
      button { background: linear-gradient(135deg, #f5891f, #e1251b); color: #fff; border: 0;
        border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; width: 100%; }
      .secundario { display: block; margin-top: 12px; padding: 12px 20px; border-radius: 10px;
        border: 1px solid #d6d9df; color: #1a1d23; font-size: 15px; font-weight: 600; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo"></div>
      <h1>Sin conexión</h1>
      <p>No se pudo conectar con ANCONnet. Revisa tu conexión a internet e inténtalo de nuevo.</p>
      <button onclick="location.reload()">Reintentar</button>
      <a class="secundario" href="/ventas/inventario/catalogo">Ver planos guardados</a>
    </main>
  </body>
</html>
